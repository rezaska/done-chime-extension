<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Done Chime for Claude</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Form controls don't inherit the body font by default — force it for consistency */
    button, select, input, textarea { font-family: inherit; }

    body {
      width: 288px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #fff;
      color: #111;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 16px 11px;
      border-bottom: 1px solid #f0f0f0;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .header-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }

    /* ── Toggle switch ── */
    .toggle-wrap { display: flex; align-items: center; gap: 7px; }
    .toggle-label { font-size: 12px; color: #666; }
    .toggle { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ddd; border-radius: 21px; cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 15px; height: 15px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%;
      box-shadow: 0 1px 3px rgba(0,0,0,.25);
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #111; }
    input:checked + .slider::before { transform: translateX(17px); }

    /* When the extension is toggled off, fade and lock all controls */
    .body { transition: opacity 0.2s; }
    body.is-off .body { opacity: 0.45; pointer-events: none; }

    /* ── Body ── */
    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }

    /* ── Section grouping ── */
    .group { display: flex; flex-direction: column; gap: 11px; }
    .group-title {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: #999;
    }

    .row { display: flex; align-items: center; gap: 10px; }
    .row-label { width: 62px; font-size: 12px; color: #555; flex-shrink: 0; }

    select {
      flex: 1; font-size: 12px; padding: 5px 7px;
      border: 1px solid #ddd; border-radius: 7px;
      background: #fff; color: #111; cursor: pointer;
    }
    select:focus { outline: 2px solid #111; outline-offset: 1px; border-color: transparent; }

    input[type=range] {
      flex: 1; height: 4px; appearance: none; background: #ddd;
      border-radius: 4px; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: #111;
      box-shadow: 0 1px 3px rgba(0,0,0,.3);
    }
    input[type=range]:focus { outline: none; }
    input[type=range]:focus::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(0,0,0,.15); }

    .vol-val { font-size: 12px; color: #666; min-width: 30px; text-align: right; }

    .divider { height: 1px; background: #f0f0f0; }

    .notif-row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .notif-label { font-size: 12px; color: #555; }
    .notif-hint { font-size: 11px; color: #aaa; margin-top: 2px; }

    /* ── Preview ── */
    .preview-wrap { position: relative; }

    .preview-btn {
      width: 100%; padding: 8px 12px;
      border: 1px solid #ddd; border-radius: 8px;
      background: #f7f7f7; font-size: 12px; font-weight: 500;
      color: #111; cursor: pointer; transition: background 0.12s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .preview-btn:hover { background: #efefef; }
    .preview-btn:active { background: #e5e5e5; transform: scale(0.98); }

    /* Overlaid below the button so it doesn't add height or shift layout */
    .status-row {
      position: absolute; left: 0; right: 0; top: calc(100% + 5px);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      pointer-events: none;
    }
    .status { font-size: 11px; color: #aaa; }

    /* ── Privacy link ── */
    .privacy-link {
      display: block; text-align: center;
      font-size: 11px; color: #bbb; text-decoration: none;
      padding: 6px 0 10px;
      border-top: 1px solid #f0f0f0;
      margin-top: 2px;
    }
    .privacy-link:hover { color: #888; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <span class="header-title">Done Chime for Claude</span>
    </div>
    <div class="toggle-wrap">
      <span class="toggle-label" id="enabledLabel">On</span>
      <label class="toggle" aria-label="Enable or disable Claude Bell">
        <input type="checkbox" id="enabledToggle" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="body">
    <section class="group">
      <div class="group-title">Sound</div>

      <div class="row">
        <span class="row-label">Tone</span>
        <select id="soundSelect" aria-label="Choose notification sound">
          <option value="chime">Chime (4 notes)</option>
          <option value="bell">Bell (3 notes)</option>
          <option value="ding">Ding (single)</option>
          <option value="soft">Soft ping</option>
        </select>
      </div>

      <div class="row">
        <span class="row-label">Volume</span>
        <input type="range" id="volSlider" min="0" max="100" value="70" step="1"
               aria-label="Volume" aria-valuetext="70 percent" />
        <span class="vol-val" id="volVal" aria-live="polite">70%</span>
      </div>

      <div class="preview-wrap">
        <button class="preview-btn" id="previewBtn" aria-label="Preview notification sound">
          <span>▶</span> Preview sound
        </button>
        <div class="status-row">
          <span class="status" id="status" aria-live="polite"></span>
        </div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="group">
      <div class="group-title">Notifications</div>

      <div class="notif-row">
        <div>
          <div class="notif-label">Browser notifications</div>
          <div class="notif-hint">Shows a popup even in background tabs</div>
        </div>
        <label class="toggle" aria-label="Toggle browser notifications">
          <input type="checkbox" id="notifToggle" checked />
          <span class="slider"></span>
        </label>
      </div>
    </section>
  </div>

  <a class="privacy-link" href="https://www.rezasoleimani.ca/done-chime/privacy/" target="_blank" rel="noopener">
    Privacy policy · No data collected
  </a>

  <script src="popup.js"></script>
</body>
</html>
